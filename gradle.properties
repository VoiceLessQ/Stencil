# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MC 26.3 requires JDK 25. Point Gradle at it either via JAVA_HOME or the
# user-level ~/.gradle/gradle.properties (`org.gradle.java.home=...`), which
# lives outside the repo so the path stays off this machine's business.

# 26.x ships pre-deobfed via NeoForge maven; tell Loom not to remap.
fabric.loom.disableObfuscation=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# Mappings: official Mojmap. See build.gradle.
minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version=0.2.0-alpha+26.3
maven_group=me.apika
archives_base_name=stencil

# Dependencies
fabric_version=0.161.0+26.3
