plugins {
	id 'dev.architectury.loom' version '1.14-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven { url = 'https://maven.neoforged.net/releases' }
	maven { url = 'https://maven.architectury.dev/' }
}

loom {
	runs {
		configureEach {
			vmArg "-Xmx3G"
			vmArg "-Xms512M"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	// No mappings line: with fabric.loom.disableObfuscation=true the jar is
	// already in named (mojmap) form, so Loom must not try to remap.
	// Plain implementation (not modImplementation) for the same reason.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xmaxerrs', '9999'])
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	manifest {
		attributes("Implementation-Version": "${project.version}")
	}
}
